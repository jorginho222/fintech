parameters:
    app.mailer.from_address: '%env(MAILER_FROM_ADDRESS)%'
    app.credit_bureau_simulation.webhook_url: '%env(CREDIT_BUREAU_SIMULATION_WEBHOOK_URL)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Company/Domain/Model/'
            - '../src/CreditRequest/Domain/Model/'
            - '../src/Kernel.php'

    # Repository interface → implementation bindings
    App\Company\Domain\Repository\CompanyRepositoryInterface:
        alias: App\Company\Infrastructure\Persistence\Repository\DoctrineCompanyRepository

    App\CreditRequest\Domain\Repository\CreditRequestRepositoryInterface:
        alias: App\CreditRequest\Infrastructure\Persistence\Repository\DoctrineCreditRequestRepository

    App\CreditRequest\Domain\Repository\CreditRequestApplicationRepositoryInterface:
        alias: App\CreditRequest\Infrastructure\Persistence\Repository\DoctrineCreditRequestApplicationRepository

    App\CreditRequest\Domain\Service\CreditRequestProposalExpirationNotifierInterface:
        alias: App\CreditRequest\Infrastructure\Service\CreditRequestProposalExpirationMailer

    App\CreditRequest\Infrastructure\Service\CreditRequestProposalExpirationMailer:
        arguments:
            $fromAddress: '%app.mailer.from_address%'

    App\CreditRequest\Domain\Service\CreditRequestApplicationWebhookClientInterface:
        alias: App\CreditRequest\Infrastructure\Service\CreditRequestApplicationWebhookClient

    App\CreditRequest\Infrastructure\Service\CreditRequestApplicationWebhookClient:
        arguments:
            $webhookUrl: '%app.credit_bureau_simulation.webhook_url%'

    App\Shared\Domain\Service\TransactionManagerInterface:
        alias: App\Shared\Infrastructure\Service\DoctrineTransactionManager
